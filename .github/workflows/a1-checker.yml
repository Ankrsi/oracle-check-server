name: A1 capacity checker

on:
  schedule:
    - cron: "0 */6 * * *" # start a new run every 6 hours
  workflow_dispatch: # lets you start it manually from the Actions tab
    inputs:
      test_alert:
        description: "Send a test alert email (fails the run on purpose)"
        type: boolean
        default: false

concurrency:
  group: a1-checker
  cancel-in-progress: true # a new run replaces the old one, so it never overlaps

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test alert
        if: ${{ inputs.test_alert }}
        run: |
          echo "::error::TEST ALERT - if you got this email, alerts are working."
          exit 1
      - run: npm ci
      - run: node a1-checker.js
        env:
          MAX_MINUTES: 350
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ap-hyderabad-1
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
